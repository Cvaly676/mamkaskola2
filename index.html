<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Učíme se vařit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; font-size: 32px; }
        h2 { color: #555; margin-top: 30px; }
        
        /* Navigace a obrazovky */
        .screen { display: none; }
        .active { display: block; }
        
        /* Tlačítka v menu */
        .menu-category {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .menu-btn {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .menu-btn:active { transform: scale(0.95); }
        .btn-warm { background-color: #ff6b6b; }
        .btn-cold { background-color: #4dabf7; }
        .btn-back { background-color: #888; font-size: 18px; padding: 10px 20px; margin-bottom: 20px; }

        .instructions {
            font-size: 26px;
            margin-bottom: 20px;
            color: #0056b3;
            font-weight: bold;
        }
        
        /* Herní plocha */
        #drop-zone {
            width: 300px;
            height: 300px;
            border: 6px dashed #ccc;
            border-radius: 50%;
            margin: 0 auto 30px auto;
            background-color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 80px; /* pro zobrazení emoji hrnce/talíře na pozadí */
        }
        
        .ingredients-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .ingredient {
            width: 110px;
            height: 110px;
            background-color: #fff;
            border: 3px solid #999;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            touch-action: none;
            text-align: center;
            padding: 5px;
        }
        .ingredient span { font-size: 35px; margin-bottom: 5px; }
        
        #message {
            font-size: 30px;
            margin-top: 25px;
            font-weight: bold;
            height: 40px;
        }
    </style>
</head>
<body>

    <!-- OBRAZOVKA 1: HLAVNÍ MENU -->
    <div id="screen-menu" class="screen active">
        <h1>Co budeme dnes připravovat?</h1>
        
        <div class="menu-category">
            <h2>🧊 Studená kuchyně</h2>
            <button class="menu-btn btn-cold" onclick="startLevel('oblozeny_talir')">Obložený talíř</button>
            <button class="menu-btn btn-cold" onclick="startLevel('vajickova_pomazanka')">Vajíčková pomazánka</button>
            <button class="menu-btn btn-cold" onclick="startLevel('testovinovy_salat')">Těstovinový salát</button>
        </div>

        <div class="menu-category">
            <h2>🔥 Teplá kuchyně</h2>
            <button class="menu-btn btn-warm" onclick="startLevel('polevky')">Polévka (Základ)</button>
            <button class="menu-btn btn-warm" onclick="startLevel('bolonske_spagety')">Boloňské špagety</button>
        </div>
    </div>

    <!-- OBRAZOVKA 2: HRA -->
    <div id="screen-game" class="screen">
        <button class="menu-btn btn-back" onclick="showMenu()">Zpět do menu</button>
        
        <h1 id="level-title">Název jídla</h1>
        <div class="instructions" id="level-instructions">Instrukce...</div>

        <!-- Místo kam se hází (Talíř nebo Hrnec) -->
        <div id="drop-zone" ondragover="allowDrop(event)" ondrop="drop(event)">
            <!-- Zde se budou objevovat suroviny -->
        </div>

        <!-- Zde se vygenerují suroviny pro daný level -->
        <div class="ingredients-container" id="ingredients"></div>

        <div id="message"></div>
    </div>

    <script>
        // DATABÁZE ÚROVNÍ
        const levels = {
            oblozeny_talir: {
                title: "Obložený talíř",
                instructions: "Přetáhni na talíř suroviny, které patří na obložený talíř.",
                dropZoneIcon: "🍽️",
                items: [
                    { id: "sunka", name: "Šunka", icon: "🍖", correct: true },
                    { id: "vejce", name: "Vejce", icon: "🥚", correct: true },
                    { id: "syr", name: "Sýr", icon: "🧀", correct: true },
                    { id: "rajce", name: "Rajče", icon: "🍅", correct: true },
                    { id: "okurka", name: "Kyselá okurka", icon: "🥒", correct: true },
                    { id: "cesnek", name: "Česnek", icon: "🧄", correct: false },
                    { id: "cibule", name: "Cibule", icon: "🧅", correct: false }
                ]
            },
            vajickova_pomazanka: {
                title: "Vajíčková pomazánka",
                instructions: "Přetáhni do mísy to, co patří do vajíčkové pomazánky.",
                dropZoneIcon: "🥣",
                items: [
                    { id: "vejce", name: "Vejce", icon: "🥚", correct: true },
                    { id: "sul", name: "Sůl", icon: "🧂", correct: true },
                    { id: "syr", name: "Sýr / Máslo", icon: "🧈", correct: true },
                    { id: "horcice", name: "Hořčice", icon: "🍯", correct: true },
                    { id: "brambor", name: "Brambora", icon: "🥔", correct: false },
                    { id: "ryby", name: "Ryby", icon: "🐟", correct: false }
                ]
            },
            testovinovy_salat: {
                title: "Těstovinový salát",
                instructions: "Přetáhni do mísy suroviny na těstovinový salát.",
                dropZoneIcon: "🥗",
                items: [
                    { id: "testoviny", name: "Těstoviny", icon: "🍝", correct: true },
                    { id: "kureci", name: "Kuřecí maso", icon: "🍗", correct: true },
                    { id: "sunka", name: "Šunka", icon: "🍖", correct: true },
                    { id: "syr", name: "Sýr", icon: "🧀", correct: true },
                    { id: "okurek", name: "Okurek", icon: "🥒", correct: true },
                    { id: "fazole", name: "Fazole", icon: "🫘", correct: false },
                    { id: "jogurt", name: "Ovocný jogurt", icon: "🍓", correct: false }
                ]
            },
            polevky: {
                title: "Polévky (Základ)",
                instructions: "Přetáhni do hrnce to, z čeho se běžně vaří polévka.",
                dropZoneIcon: "🍲",
                items: [
                    { id: "brokolice", name: "Brokolice", icon: "🥦", correct: true },
                    { id: "cocka", name: "Čočka", icon: "🧆", correct: true },
                    { id: "brambor", name: "Brambora", icon: "🥔", correct: true },
                    { id: "fazole", name: "Fazole", icon: "🫘", correct: true },
                    { id: "mrkev", name: "Mrkev", icon: "🥕", correct: true },
                    { id: "meloun", name: "Meloun", icon: "🍉", correct: false },
                    { id: "mandarinka", name: "Mandarinka", icon: "🍊", correct: false }
                ]
            },
            bolonske_spagety: {
                title: "Boloňské špagety",
                instructions: "Přetáhni do hrnce suroviny na boloňské špagety.",
                dropZoneIcon: "🍝",
                items: [
                    { id: "spagety", name: "Špagety", icon: "🍝", correct: true },
                    { id: "rajce", name: "Rajče / Protlak", icon: "🍅", correct: true },
                    { id: "cesnek", name: "Česnek", icon: "🧄", correct: true },
                    { id: "mrkev", name: "Mrkev", icon: "🥕", correct: true },
                    { id: "mlete_maso", name: "Mleté maso", icon: "🥩", correct: true },
                    { id: "kureci", name: "Kuřecí maso", icon: "🍗", correct: false },
                    { id: "cokolada", name: "Čokoláda", icon: "🍫", correct: false }
                ]
            }
        };

        let currentLevelInfo = null;
        let correctItemsPlaced = 0;
        let totalCorrectItems = 0;

        // FUNKCE PRO ZOBRAZENÍ MENU
        function showMenu() {
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-menu').classList.add('active');
        }

        // FUNKCE PRO START ÚROVNĚ
        function startLevel(levelKey) {
            currentLevelInfo = levels[levelKey];
            correctItemsPlaced = 0;
            totalCorrectItems = currentLevelInfo.items.filter(item => item.correct).length;

            // Změna obrazovek
            document.getElementById('screen-menu').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');

            // Nastavení textů
            document.getElementById('level-title').innerText = currentLevelInfo.title;
            document.getElementById('level-instructions').innerText = currentLevelInfo.instructions;
            document.getElementById('message').innerText = "";
            
            // Vyčištění talíře/hrnce a nastavení ikony na pozadí
            let dropZone = document.getElementById('drop-zone');
            dropZone.innerHTML = currentLevelInfo.dropZoneIcon;
            dropZone.style.color = "#eee"; // Světlá barva pro ikonu na pozadí
            
            // Vygenerování surovin a jejich zamíchání (aby nebyly vždy ve stejném pořadí)
            let ingredientsContainer = document.getElementById('ingredients');
            ingredientsContainer.innerHTML = "";
            
            // Zamíchání pole surovin
            let shuffledItems = currentLevelInfo.items.sort(() => 0.5 - Math.random());

            shuffledItems.forEach(item => {
                let div = document.createElement('div');
                div.className = "ingredient";
                div.draggable = true;
                div.id = item.id;
                div.setAttribute("data-correct", item.correct);
                div.ondragstart = drag;
                
                // Vložení ikony a názvu (Pro použití reálných fotek by se sem vkládal <img src="...">)
                div.innerHTML = `<span>${item.icon}</span> ${item.name}`;
                ingredientsContainer.appendChild(div);
            });
        }

        // LOGIKA PRO TAŽENÍ A PUŠTĚNÍ (DRAG & DROP)
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            let data = ev.dataTransfer.getData("text");
            let draggedElement = document.getElementById(data);
            
            if (!draggedElement || draggedElement.parentElement.id === "drop-zone") return;

            let isCorrect = draggedElement.getAttribute("data-correct") === "true";
            let messageEl = document.getElementById("message");
            let dropZone = document.getElementById('drop-zone');

            if (isCorrect) {
                // Pokud je to první správná surovina, smažeme ikonu pozadí (např. 🍽️)
                if (correctItemsPlaced === 0) {
                    dropZone.innerHTML = "";
                }

                // Správná volba - přesune se na talíř
                dropZone.appendChild(draggedElement);
                draggedElement.draggable = false;
                draggedElement.style.cursor = "default";
                draggedElement.style.borderColor = "#4caf50";
                draggedElement.style.backgroundColor = "#e6ffe6";
                draggedElement.style.width = "80px"; // Zmenšení po vložení
                draggedElement.style.height = "80px";
                draggedElement.style.fontSize = "12px";
                draggedElement.querySelector('span').style.fontSize = "25px";
                
                messageEl.style.color = "green";
                messageEl.innerText = "Výborně! To tam patří.";
                correctItemsPlaced++;

                // Kontrola, zda jsou všechny správné suroviny na místě
                if (correctItemsPlaced === totalCorrectItems) {
                    messageEl.innerText = "Skvělá práce! Pokrm je hotový!";
                }
            } else {
                // Špatná volba - vrátí se a napíše chybu
                messageEl.style.color = "red";
                messageEl.innerText = "Pozor, toto do jídla nepatří.";
            }
        }
    </script>
</body>
</html>
